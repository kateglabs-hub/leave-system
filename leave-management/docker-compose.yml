services:
  # PostgreSQL Database Service
  postgres:
    image: postgres:15-alpine
    container_name: leave_management_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leave_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leave_password}
      POSTGRES_DB: ${POSTGRES_DATABASE:-leave_management}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    networks:
      - leave_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leave_user}"]
      timeout: 20s
      retries: 10
    restart: unless-stopped

  # PHP Application Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leave_management_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-leave_management}
      POSTGRES_USER: ${POSTGRES_USER:-leave_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-leave_password}
      APP_ENV: ${APP_ENV:-development}
      APP_DEBUG: ${APP_DEBUG:-true}
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./public:/var/www/html/public
    networks:
      - leave_network
    restart: unless-stopped

  # pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: leave_management_pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "${PHPMYADMIN_PORT:-8080}:80"
    networks:
      - leave_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  leave_network:
    driver: bridge
